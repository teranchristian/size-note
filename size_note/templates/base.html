<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17483d">
    <title>{% block title %}Size Note{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/size-note-icon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/person_birth.css') }}">
    <script defer src="{{ url_for('static', path='/person_birth.js') }}"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('home') }}" aria-label="Size Note home">
        <img src="{{ url_for('static', path='/size-note-icon.svg') }}" alt="" aria-hidden="true" width="34" height="34" style="display:block;flex:0 0 auto;">
        <span>Size Note</span>
      </a>
      <a class="header-action" href="{{ url_for('new_person') }}">Add person</a>
    </header>

    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <a href="{{ url_for('home') }}"><span aria-hidden="true">●</span>People</a>
      <a href="{{ url_for('new_person') }}"><span aria-hidden="true">＋</span>Add</a>
      <a href="{{ url_for('reviews') }}"><span aria-hidden="true">✓</span>Review</a>
    </nav>
  </body>
</html>
